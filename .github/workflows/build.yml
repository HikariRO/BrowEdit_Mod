name: Build HikariRO BrowEdit Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Clone BrowEdit3 v3.639
        shell: pwsh
        run: git clone --branch v3.639 --depth 1 https://github.com/Borf/BrowEdit3.git source

      - name: Decode and apply HikariRO patch
        shell: pwsh
        run: |
          $inputFile = [IO.File]::OpenRead("patches/0001-add-procedural-map-generator.patch.gz.b64")
          $gzip = [IO.Compression.GzipStream]::new($inputFile, [IO.Compression.CompressionMode]::Decompress)
          $outputFile = [IO.File]::Create("generator.patch")
          $gzip.CopyTo($outputFile)
          $outputFile.Close()
          $gzip.Close()
          $inputFile.Close()
          cd source
          git config user.name "HikariRO Build"
          git config user.email "noreply@hikariro.com"
          git am ../generator.patch

      - uses: microsoft/setup-msbuild@v2

      - name: Set build version
        shell: pwsh
        working-directory: source
        run: Set-Content -Path Version.h -Value '#define VERSION 672'

      - name: Build
        working-directory: source
        run: msbuild /m /p:Configuration=Release .

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item source/BrowEdit3.exe dist/HikariRO_BrowEdit_Mod_v3.672.exe
          Copy-Item source/imgui.ini dist/
          Copy-Item source/lib/bugtrap/BugTrap-x64.dll dist/
          Copy-Item source/data dist/data -Recurse
          Copy-Item source/docs dist/docs -Recurse
          "HikariRO BrowEdit Mod v3.672`nCommit: $env:GITHUB_SHA" | Set-Content dist/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HikariRO-BrowEdit-Mod-v3.672
          path: dist

      - name: Create verified release package
        shell: pwsh
        run: |
          $archive = "HikariRO-BrowEdit-Mod-v3.672.zip"
          Compress-Archive -Path dist\* -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v3.672"
          $archive = "HikariRO-BrowEdit-Mod-v3.672.zip"
          $notes = @"
          HikariRO BrowEdit Mod v3.672

          Descarga oficial compilada automáticamente desde el código público.
          Se incluye el archivo SHA-256 para verificar la integridad del ZIP.
          "@
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $archive "$archive.sha256" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $archive "$archive.sha256" --title "HikariRO BrowEdit Mod v3.672" --notes $notes --latest --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          }
